<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - CGPA Booster</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-inner">
        <a href="index.html" class="logo">CGPA Booster</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="resources.html">Resources</a></li>
            <li><a href="community.html">Community</a></li>
        </ul>
        <div class="nav-actions">
            <a href="login.html" class="btn btn-outline btn-sm">Login</a>
        </div>
        <div class="hamburger"><span></span><span></span><span></span></div>
    </div>
</nav>

<div class="auth-wrapper">
    <div class="auth-card" style="max-width:520px;">
        <h2>Create your account</h2>
        <p class="sub">Join CGPA Booster and start learning together.</p>

        <div id="alertBox" class="alert" style="display:none;"></div>

        <form id="registerForm" action="register" method="POST" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Your full name">
                <div class="field-error" id="fullNameError"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@college.edu">
                <div class="field-error" id="emailError"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Min. 6 characters">
                    <div class="field-error" id="passwordError"></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password">
                    <div class="field-error" id="confirmPasswordError"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="college">College</label>
                <input type="text" id="college" name="college" placeholder="Your college name">
                <div class="field-error" id="collegeError"></div>
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" placeholder="e.g. Computer Science">
                <div class="field-error" id="departmentError"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Log in</a>
        </div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
