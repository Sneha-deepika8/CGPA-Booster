<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resources - CGPA Booster</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
    <div class="container">
        <a href="index.html" class="logo">CGPA Booster</a>
        <ul class="app-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="resources.html" class="active">Resources</a></li>
            <li><a href="community.html">Community</a></li>
            <li><a href="profile.html">Profile</a></li>
        </ul>
        <div class="user-chip">
            <span id="userNameLabel"></span>
            <a href="logout" class="btn btn-outline btn-sm" style="margin-left:10px;">Logout</a>
        </div>
    </div>
</header>

<main class="container">
    <h1 class="page-title">Learning Resources</h1>
    <p class="page-subtitle">Discover, search and share notes, guides and materials.</p>

    <div id="alertBox" class="alert" style="display:none;"></div>

    <div class="toolbar">
        <div class="filters" id="categoryFilters">
            <button class="chip active" data-category="All">All</button>
            <button class="chip" data-category="Java">Java</button>
            <button class="chip" data-category="Web Development">Web Development</button>
            <button class="chip" data-category="Database">Database</button>
            <button class="chip" data-category="DSA">DSA</button>
            <button class="chip" data-category="Computer Networks">Computer Networks</button>
            <button class="chip" data-category="Operating Systems">Operating Systems</button>
            <button class="chip" data-category="General">General</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search resources...">
        </div>
        <button class="btn btn-primary" id="openAddModal">+ Share Resource</button>
    </div>

    <div class="grid grid-3" id="resourcesGrid">
        <p style="color:var(--text-light);">Loading resources...</p>
    </div>
</main>

<!-- Add Resource Modal -->
<div class="modal-overlay" id="addModal">
    <div class="modal-box">
        <span class="modal-close" id="closeAddModal">&times;</span>
        <h3>Share a Resource</h3>
        <div id="modalAlert" class="alert" style="display:none;"></div>
        <form id="addResourceForm">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="e.g. Complete DSA Notes" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="3" placeholder="Briefly describe this resource"></textarea>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="Java">Java</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Database">Database</option>
                    <option value="DSA">DSA</option>
                    <option value="Computer Networks">Computer Networks</option>
                    <option value="Operating Systems">Operating Systems</option>
                    <option value="General">General</option>
                </select>
            </div>
            <div class="form-group">
                <label for="resourceUrl">Resource URL</label>
                <input type="url" id="resourceUrl" name="resourceUrl" placeholder="https://..." required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Add Resource</button>
        </form>
    </div>
</div>

<script src="js/script.js"></script>
<script>
let currentCategory = 'All';
let currentKeyword = '';

document.addEventListener('DOMContentLoaded', function () {
    loadUser();
    loadResources();

    document.querySelectorAll('#categoryFilters .chip').forEach(chip => {
        chip.addEventListener('click', function () {
            document.querySelectorAll('#categoryFilters .chip').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.dataset.category;
            loadResources();
        });
    });

    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', function () {
        clearTimeout(searchTimeout);
        const value = this.value;
        searchTimeout = setTimeout(() => {
            currentKeyword = value;
            loadResources();
        }, 300);
    });

    document.getElementById('openAddModal').addEventListener('click', () => {
        document.getElementById('addModal').classList.add('open');
    });
    document.getElementById('closeAddModal').addEventListener('click', () => {
        document.getElementById('addModal').classList.remove('open');
    });

    document.getElementById('addResourceForm').addEventListener('submit', handleAddResource);

    if (new URLSearchParams(window.location.search).get('action') === 'share') {
        document.getElementById('addModal').classList.add('open');
    }
});

async function loadUser() {
    const res = await apiRequest('profile', { method: 'GET' });
    if (!res.ok || !res.data.success) {
        window.location.href = 'login.html?error=Please+log+in+to+continue.';
        return;
    }
    document.getElementById('userNameLabel').textContent = res.data.fullName;
}

async function loadResources() {
    const grid = document.getElementById('resourcesGrid');
    grid.innerHTML = '<p style="color:var(--text-light);">Loading resources...</p>';

    let url = 'resources?action=list';
    if (currentKeyword.trim()) {
        url = 'resources?action=search&keyword=' + encodeURIComponent(currentKeyword.trim());
    } else if (currentCategory !== 'All') {
        url = 'resources?action=filter&category=' + encodeURIComponent(currentCategory);
    }

    const res = await apiRequest(url, { method: 'GET' });
    if (!res.ok || !res.data.success) {
        grid.innerHTML = '<p style="color:var(--text-light);">Could not load resources.</p>';
        return;
    }

    const resources = res.data.resources;
    if (resources.length === 0) {
        grid.innerHTML = '<div class="empty-state">No resources found. Try a different search or category.</div>';
        return;
    }

    grid.innerHTML = resources.map(r => `
        <div class="card resource-card">
            <span class="badge">${escapeHtml(r.category)}</span>
            <h3>${escapeHtml(r.title)}</h3>
            <p>${escapeHtml(r.description || 'No description provided.')}</p>
            <div class="meta">
                <span>By ${escapeHtml(r.uploadedByName)}</span>
                <div class="card-actions">
                    <a href="${escapeHtml(r.resourceUrl)}" target="_blank" rel="noopener" class="btn btn-outline btn-sm">Open</a>
                    ${r.isOwner ? `<button class="btn btn-danger btn-sm" onclick="deleteResource(${r.id})">Delete</button>` : ''}
                </div>
            </div>
        </div>
    `).join('');
}

async function handleAddResource(e) {
    e.preventDefault();
    const body = toFormBody({
        title: document.getElementById('title').value.trim(),
        description: document.getElementById('description').value.trim(),
        category: document.getElementById('category').value,
        resourceUrl: document.getElementById('resourceUrl').value.trim()
    });

    const res = await apiRequest('resources', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
    });

    const modalAlert = document.getElementById('modalAlert');
    if (res.ok && res.data.success) {
        document.getElementById('addResourceForm').reset();
        document.getElementById('addModal').classList.remove('open');
        loadResources();
    } else {
        modalAlert.textContent = res.data.message || 'Could not add resource.';
        modalAlert.className = 'alert alert-error';
        modalAlert.style.display = 'block';
    }
}

async function deleteResource(id) {
    if (!confirmDelete('Delete this resource? This cannot be undone.')) return;

    const res = await apiRequest('resources', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: toFormBody({ action: 'delete', id: id })
    });

    if (res.ok && res.data.success) {
        loadResources();
    } else {
        alert(res.data.message || 'Could not delete resource.');
    }
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
}
</script>
</body>
</html>
